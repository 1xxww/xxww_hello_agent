[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-agent"
version = "0.1.0"
description = "A modular AI agent development framework supporting Multi-Agent, Tools, Memory, RAG, and MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "xxww" }
]
keywords = ["ai", "agent", "llm", "rag", "mcp", "multi-agent"]

dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "requests>=2.28.0",
    "aiosqlite>=0.19.0",
    "mcp>=1.0.0",
    "tavily-python>=0.3.0",
    "google-search-results>=2.4.0",
    "qdrant-client>=1.6.0",
    "sentence-transformers>=2.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "dashscope",
    "langchain_text_splitters",
    "unstructured",
]

[project.optional-dependencies]


[tool.setuptools.packages.find]
where = ["."]
include = ["hello_agent*"]
exclude = ["travelAssistant*", "studyAssistant*", "AI-Town*", "evaluation*", "tests*"]
