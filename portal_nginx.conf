server {
    listen 80;
    server_name _;

    # 1. 聚合门户首页 (Landing Hub)
    location / {
        root /opt/portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. 智能旅行助手 (TravelWhisperer)
    location ^~ /travel/ {
        alias /opt/travelAssistant/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /travel/index.html;
    }

    location ^~ /travel/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # 高德地图安全反向代理网关
    location ^~ /_AMapService/ {
        proxy_pass http://127.0.0.1:8001/_AMapService/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. AI 深度研究助手 (DeepStudy)
    location ^~ /study/ {
        alias /opt/studyAssistant/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /study/index.html;
    }

    location ^~ /study/api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        # 支持 SSE 实时流式传输
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 4. 赛博小镇 (CyberTown Web 端)
    location ^~ /town/ {
        alias /opt/AI-town/web/;
        index index.html;
        try_files $uri $uri/ /town/index.html;
    }

    location ^~ /town/api/ {
        proxy_pass http://127.0.0.1:8003/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_connect_timeout 180s;
    }
}
